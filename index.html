<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3ddc6"><title>Yasso | Birthday Invitation</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3ddc6;min-height:100dvh;display:grid;place-items:center;font-family:Georgia,serif}.page{width:min(100%,635px);position:relative;display:none;line-height:0;box-shadow:0 8px 35px #7a43302a}.page.active{display:block}.page img{width:100%;height:auto;display:block}.hotspot{position:absolute;display:block;border:0;background:transparent;cursor:pointer;z-index:2;border-radius:40px;touch-action:manipulation}.hotspot:focus-visible{outline:3px solid #ffd879;outline-offset:2px}.hotspot:active{background:#fff2}.first-button{left:30%;top:88%;width:41%;height:7%}.rsvp{left:20%;top:74.1%;width:31%;height:9%}.location{left:55%;top:74.1%;width:32%;height:9%;cursor:default}.instagram{left:29%;top:84.4%;width:43%;height:9%}.dialog-wrap{position:fixed;inset:0;background:#2b111ab8;display:none;place-items:center;padding:20px;z-index:10;line-height:1.5}.dialog-wrap.show{display:grid}.dialog{position:relative;width:min(100%,410px);border:2px solid #bd8755;border-radius:22px;padding:27px 22px;background:#fff2df;color:#70434d;text-align:center;box-shadow:0 15px 50px #0005}.dialog h2{margin:0 0 10px}.dialog input{width:100%;padding:13px;border-radius:12px;border:1px solid #b58b85;font-size:17px;margin:10px 0;background:#fffaf4}.dialog button.primary{background:#a65b6c;color:white;border:1px solid #dfb875;padding:13px 24px;border-radius:30px;cursor:pointer;font-size:16px}.close{position:absolute;top:8px;left:10px;border:0;background:none;font-size:30px;color:#70434d;cursor:pointer}.note{font:13px/1.6 sans-serif;color:#805b60;margin-top:12px}.back{position:fixed;top:12px;left:12px;z-index:4;border:1px solid #d5ae7b;border-radius:30px;background:#a65b6c;color:white;padding:9px 14px;cursor:pointer;display:none}.back.show{display:block}@media(min-width:700px){.page{margin:15px auto;border-radius:3px;overflow:hidden}}

.music-control{position:fixed;right:12px;top:12px;z-index:8;border:1px solid #eac88c;border-radius:30px;background:#a65b6cf2;color:#fff8e9;padding:10px 15px;box-shadow:0 3px 12px #0003;font:15px Arial,sans-serif;cursor:pointer}
</style></head><body>
<audio id="birthdayMusic" src="birthday-song.mp3" preload="auto" loop autoplay playsinline></audio><button id="musicButton" class="music-control" type="button" aria-label="تشغيل أو إيقاف الموسيقى">♫ تشغيل الموسيقى</button><main id="page1" class="page active" aria-label="Birthday invitation cover"><img src="Yasso_animated_birthday_FIXED.gif" alt="Yasso birthday invitation cover, animated candles and gold sparkles"><button class="hotspot first-button" aria-label="Open Invitation" onclick="showPage(2)"></button></main>
<main id="page2" class="page" aria-label="Yasso birthday invitation details"><img src="Yasso_second_page_animated.gif" alt="Birthday message for Yasso with RSVP, Location and Symblona bookmarks buttons"><button class="hotspot rsvp" aria-label="Confirm Your Attendance" onclick="openRSVP()"></button><button class="hotspot location" aria-label="Location, no link" type="button"></button><a class="hotspot instagram" aria-label="Symblona bookmarks Instagram" href="https://www.instagram.com/symblona_bookmarks?srtk=cGZrYnhvOXdkcWVu" target="_blank" rel="noopener noreferrer"></a></main>
<button class="back" id="back" onclick="showPage(1)" aria-label="Back to invitation cover">↩ Back</button>
<div class="dialog-wrap" id="rsvpDialog" role="dialog" aria-modal="true" aria-labelledby="rsvpTitle"><div class="dialog"><button class="close" onclick="closeRSVP()" aria-label="Close">×</button><h2 id="rsvpTitle">Confirm Your Attendance 💗</h2><p>يسعدنا حضورك عيد ميلاد ياسو 🎂</p><form id="rsvpForm"><input name="guest" id="guest" maxlength="80" placeholder="اسمك / Your name" required autocomplete="name"><button class="primary" type="submit">تأكيد الحضور ✓</button></form><p id="confirmation" role="status"></p><p class="note">التأكيد محفوظ على جهازك فقط، ولا يُرسل تلقائيًا لمنظّم الحفلة.</p></div></div>
<script>
function showPage(n){document.getElementById('page1').classList.toggle('active',n===1);document.getElementById('page2').classList.toggle('active',n===2);document.getElementById('back').classList.toggle('show',n===2);window.scrollTo({top:0,behavior:'instant'});location.hash=n===2?'invitation':'cover'}
function openRSVP(){document.getElementById('rsvpDialog').classList.add('show');document.getElementById('guest').focus()}
function closeRSVP(){document.getElementById('rsvpDialog').classList.remove('show')}
document.getElementById('rsvpForm').addEventListener('submit',function(e){e.preventDefault();let name=document.getElementById('guest').value.trim();if(!name)return;try{localStorage.setItem('yasso_rsvp',JSON.stringify({name,confirmed:true,date:new Date().toISOString()}))}catch(e){}document.getElementById('confirmation').textContent='تم تأكيد حضورك يا '+name+' 🎉';this.style.display='none'});
document.getElementById('rsvpDialog').addEventListener('click',function(e){if(e.target===this)closeRSVP()});document.addEventListener('keydown',function(e){if(e.key==='Escape')closeRSVP()});if(location.hash==='#invitation')showPage(2);

const music=document.getElementById('birthdayMusic');
const musicButton=document.getElementById('musicButton');
music.volume=0.8;
function updateMusicButton(){musicButton.textContent=music.paused?'♫ تشغيل الموسيقى':'♫ إيقاف الموسيقى'}
async function startMusic(){delete music.dataset.manuallyPaused;try{await music.play()}catch(e){}updateMusicButton()}
musicButton.addEventListener('click',async()=>{if(music.paused)await startMusic();else{music.pause();music.dataset.manuallyPaused='yes';updateMusicButton()}});
document.addEventListener('pointerdown',()=>{if(music.paused&&!music.dataset.manuallyPaused)startMusic()},{once:true});
window.addEventListener('load',startMusic);
</script></body></html>
